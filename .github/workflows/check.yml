name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regla nativa y sintaxis
        run: npm run check
      - name: Pruebas
        run: npm test
      - name: main.js está al día con src/
        run: |
          npm run build
          git diff --exit-code main.js || (echo "::error::main.js no coincide con src/. Ejecuta 'npm run build' y haz commit." && exit 1)
      - name: Empaquetado
        run: node tools/package.js
