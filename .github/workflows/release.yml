name: Release

# Tres formas de publicar una versión (todas construyen el .ccx y lo adjuntan):
#  1) Desde la web de GitHub: Releases › Draft a new release › tag "vX.Y.Z" (crear en main) › Publish.
#  2) Desde git: git tag vX.Y.Z && git push origin vX.Y.Z
#  3) Manual: Actions › Release › Run workflow, con el tag (crea el tag sobre la rama elegida si no existe).
# El tag debe coincidir con la versión de manifest.json.
on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (p. ej. v1.3.0). Debe coincidir con manifest.json"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # En ejecución manual el tag puede no existir aún: se construye la rama elegida
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: El tag tiene formato vX.Y.Z
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Tag inválido: $TAG (usa vX.Y.Z)"; exit 1 ;;
          esac
      - name: El tag coincide con la versión del manifest
        run: |
          v="v$(node -p "require('./manifest.json').version")"
          if [ "$v" != "$TAG" ]; then
            echo "::error::El tag $TAG no coincide con manifest.json ($v)"; exit 1
          fi
      - name: Construir .ccx
        run: npm run package
      - name: Copia con nombre estable (enlace de descarga de la web)
        run: cp dist/OpenDTF_v*.ccx dist/OpenDTF.ccx
      - name: Crear el release si no existe y adjuntar el .ccx
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Open-DTF $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/OpenDTF_v*.ccx dist/OpenDTF.ccx --clobber
